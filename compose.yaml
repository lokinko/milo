services:
  milo:
    image: milo:current
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/milo}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MILO_PORT:-3088}:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Run deploy.sh first}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Run deploy.sh first}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/milo}
      DATABASE_PATH: /app/data/milo.sqlite
    volumes:
      - milo-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000'+process.env.NEXT_PUBLIC_BASE_PATH+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  milo-data:
    name: milo-data
